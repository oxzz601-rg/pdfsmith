name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Smoke-test the CLI on a real PDF
        run: |
          python -m pip install reportlab
          python -c "from reportlab.pdfgen import canvas; c = canvas.Canvas('demo.pdf'); c.drawString(72, 720, 'hello'); c.showPage(); c.save()"
          python -m pdfsmith info demo.pdf
          python -m pdfsmith split demo.pdf parts --every 1
